<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3a3a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zweirad Sturm">
  <title>Kundenapp Zweirad Sturm</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-eingang="kunde">
  <main>
    <header class="top">
      <button type="button" id="logo-button" class="logo-button" aria-label="Zweirad Sturm">
        <img id="logo" class="logo" alt="" src="/logo.png">
        <span id="wordmark" class="wordmark">ZWEIRAD STURM</span>
          <span id="tagline" class="tagline">Dein KTM, Husqvarna und GASGAS Motorradshop</span>
      </button>
      <p class="role">Kundenapp</p>
      <div id="shop-lines" class="shop-lines"></div>
    </header>
    <nav class="switch" aria-label="Eingang">
      <button type="button" id="tab-kunde" aria-pressed="true">Kunde</button>
      <button type="button" id="tab-kasse" aria-pressed="false">Kasse</button>
    </nav>
    <div class="panels">
      <section id="kunde" aria-label="Kunde">
        <h2>Kunde</h2>
        <p>Einen Moment.</p>
      </section>
      <section id="kasse" aria-label="Kasse">
        <h2>Kasse</h2>
      </section>
    </div>
    <p class="homepage"><a href="https://www.ktm-sturm.de/">Homepage</a></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
